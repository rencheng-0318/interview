[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "clinical-search-api"
version = "1.0.0"
description = "FastAPI service for the clinical record semantic search exercise"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.140.7",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "asyncpg==0.31.0",
    "pgvector==0.5.0",
    "httpx==0.28.1",
    "numpy==2.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires the real embedding service (run with `make test-integration`)",
]
filterwarnings = ["error::DeprecationWarning"]
