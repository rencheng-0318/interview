name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://clinical:local_dev_only@localhost:5432/clinical_search
      TEST_DATABASE_URL: postgresql://clinical:local_dev_only@localhost:5432/clinical_search_test
      MIGRATIONS_DIR: ${{ github.workspace }}/database/migrations
      SEED_DATA_DIR: ${{ github.workspace }}/database/seed/data
      PYTHONPATH: ${{ github.workspace }}/services/api

    steps:
      - uses: actions/checkout@v5

      - name: Start PostgreSQL
        run: docker compose up -d --build --wait db

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: services/api
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: services/api
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Lint the embedding service
        working-directory: services/embedding
        run: ruff check app download_model.py

      - name: Apply migrations
        working-directory: services/api
        run: |
          python -m app.scripts.migrate
          python -m app.scripts.migrate --database test

      - name: Verify the committed seed data is reproducible
        run: |
          python database/seed/generate.py --out /tmp/seed-check
          for file in practices users patients clinical_documents; do
            diff -q "database/seed/data/$file.csv" "/tmp/seed-check/$file.csv" \
              || { echo "::error::$file.csv differs from a fresh generation. Run 'make generate-seed' and commit the result."; exit 1; }
          done

      - name: Seed
        working-directory: services/api
        run: python -m app.scripts.seed

      - name: Test
        working-directory: services/api
        run: pytest -q

      - name: Dump database logs on failure
        if: failure()
        run: docker compose logs --tail=200 db

      - name: Tear down PostgreSQL
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  stack:
    name: Docker stack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build and start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build db embedding api

      - name: Wait for dependencies
        run: docker compose exec -T api python -m app.scripts.wait_for_dependencies

      - name: Migrate and seed
        run: |
          docker compose exec -T api python -m app.scripts.migrate
          docker compose exec -T api python -m app.scripts.migrate --database test
          docker compose exec -T api python -m app.scripts.seed

      - name: Smoke test
        run: docker compose exec -T api python -m app.scripts.smoke

      - name: Integration tests against the real embedding service
        run: docker compose exec -T api pytest -q -m integration

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
